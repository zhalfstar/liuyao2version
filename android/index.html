<!DOCTYPE html>
<html lang="zh-CN" data-build="android">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=537, initial-scale=1.0, minimum-scale=0.2, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="六爻排盘">
<meta name="theme-color" content="#1a3a5c">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="description" content="六爻排盘：自动摇卦/手动输入/卦名起卦/数字起卦，含世应六神藏爻伏神、断卦参考、案例管理与离线导出">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="icons/icon-96.png">
<link rel="icon" type="image/png" sizes="144x144" href="icons/icon-144.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="shortcut icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>六爻排盘</title>
<style>
*{box-sizing:border-box}
html,body{touch-action:manipulation;-webkit-touch-action:manipulation}
body{font-family:-apple-system,"Microsoft YaHei",system-ui,sans-serif;background:#fff;margin:0;color:#333;min-height:100%;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
.box{max-width:960px;margin:auto;background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.top-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:16px}
.h-left{flex:1}
.h-right{flex:1;text-align:right}
button{padding:8px 16px;margin:4px;cursor:pointer;border:1px solid #ccc;background:#fff;border-radius:4px;font-size:14px}
button.ghost{background:transparent}
/* CSS Grid 排盘：第3、8列min-content保证>=爻符宽度，其余auto贴合文字 */
.pan-wrap{
    display:grid;
    grid-template-columns:auto auto min-content auto auto auto auto min-content auto auto;
    gap:1px;
    background:#ddd;
    border:none;
    margin:0 auto;
    width:max-content;
    position:relative;
    padding:95px 60px 1px 12px;
}
.cell{
    white-space:nowrap;
    padding:2px 4px;
    text-align:center;
    background:#fff !important;
    font-size:14px;
    vertical-align:middle;
}
.yao-ben, .yao-bian{background:#fff !important;}
.pan-wrap, .pan-wrap .cell, .pan-wrap .cell-head, .pan-wrap .cell-left, .pan-wrap .cell-justify{background:#fff !important;}
.pan-wrap{background:#eee;}
.cell-left{text-align:left;padding:2px 4px;}
.cell-head{font-weight:bold;background:#fafafa;}
.cell-justify{display:flex;justify-content:space-between;padding-inline:4px;font-weight:bold;background:#fafafa;}
.hide-bian{visibility:hidden!important;}
/* 顶部浮动文字层：月建、日辰、卦名绝对定位，不参与网格布局 */
.pan-header-layer{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:10;}
.pan-header-item{position:absolute;white-space:nowrap;transform:translateX(0);font-weight:bold;text-align:left;background:#fff;padding:2px 4px;pointer-events:auto;z-index:20;}
/* 头部信息表格：10列结构和爻表格完全一致，列宽比例天然对齐 */
.head-table{background:#fff;margin-bottom:0}
.head-table td{font-size:15px;font-weight:bold;white-space:nowrap;overflow:visible;text-overflow:clip;text-align:center;vertical-align:middle;padding:2px}
.head-table td:empty{background:transparent}
.yao-line{
   display:inline-block;
   width:46px;
   height:10px;
   background:#000;
   vertical-align:middle;
   position:relative;
}
.yao-yang{background:#000;}
.yao-yin{background:transparent;}
.yao-yin::before,.yao-yin::after{
   content:"";
   position:absolute;
   top:0;
   width:16px;
   height:10px;
   background:#000;
}
.yao-yin::before{left:0;}
.yao-yin::after{right:0;}
.shi{color:red;font-weight:bold}
.ying{color:red;font-weight:bold}
#grid-wrap{font-family:"SimHei","黑体",sans-serif;font-weight:bold;}
#grid-wrap .shi,#grid-wrap .ying{font-family:inherit;font-weight:inherit;}
.dong-mark{color:red;font-weight:bold}
.manual{margin:14px auto 0;display:none;background:#f0f4ff;padding:12px;border-radius:6px;border:1px solid #c0d0f0;width:fit-content;max-width:100%;text-align:left}
.manual input,.manual select{height:34px;padding:4px 8px;margin:2px;font-size:14px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;vertical-align:middle;background:#fff}
.yao-idx,.gua-idx{display:inline-block;text-align:justify;text-align-last:justify;vertical-align:middle}
.case-list{margin-top:12px;text-align:left}
.case-item{background:#f9f6f0;border:1px solid #e8e0d0;padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.case-item .case-info{flex:1}
.case-item .case-num{color:#999;font-size:12px;margin-right:8px}
.case-item button{padding:4px 10px;font-size:12px;margin-left:8px}
@media(max-width:760px){
  .gua-table th,.gua-table td{font-size:12px;padding:2px 1px}
  .col-liushen{width:55px;}
  .col-cangyao{width:85px;}
  .col-ben-na{width:90px;}
  .col-bian-na{width:90px;}
}
</style>
</head>
<body>
<div class="box" id="app"></div>

// 组件 CDN 多源回退：任一源可用即成功，避免单一 CDN 被墙/离线时直接失败
const CDN_HTML2CANVAS=[
  'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',

];
// CDN 仅为兜底：html2canvas 已内联进本文件，正常情况下导出完全离线
function loadScriptAny(urls,isReady,done,fail){
  if(isReady()){done();return;}
  let i=0;
  (function next(){
    if(i>=urls.length){fail();return;}
    const url=urls[i++];
    const s=document.createElement('script');
    s.src=url;
    s.onload=function(){isReady()?done():next();};
    s.onerror=next;
    document.head.appendChild(s);
  })();
}
// 优先用内联的 html2canvas；若因裁剪/极端情况缺失，再回退到 CDN
function ensureHtml2canvas(){
  return new Promise(function(res,rej){
    if(window.html2canvas)return res();
    loadScriptAny(CDN_HTML2CANVAS,function(){return !!window.html2canvas;},res,
      function(){rej(new Error('html2canvas unavailable'));});
  });
}

/* ===== 离线 PDF 生成：不依赖 jspdf =====
   思路：html2canvas 得到整张长图 → 单页输出，页面尺寸按图比例自适应
   （宽固定 A4 宽 595.28pt，高按 宽高比 推导）→ 整卦完整落在同一页、不变形、不裁切
   → 转 JPEG(DCTDecode) → 手写最小 PDF 结构（Catalog/Pages/Page/Contents/ImageXObject + xref）。 */
function pdfNum(v){return String(Math.round(v*100)/100);}
function canvasToJpegBin(canvas,quality){
  const url=canvas.toDataURL('image/jpeg',quality||0.92);
  return atob(url.slice(url.indexOf(',')+1)); // 二进制串，每字符 1 字节
}
function pdfPagesFromCanvas(canvas){
  const PW=595.28;                     // 页宽固定 A4 宽，单位 pt
  const MAX_H=8000;                    // 超长图降采样，避免 toDataURL 超限失败
  let src=canvas, srcW=canvas.width, srcH=canvas.height;
  if(srcH>MAX_H){
    const k=MAX_H/srcH;
    const tmp=document.createElement('canvas');
    tmp.width=Math.max(1,Math.round(srcW*k)); tmp.height=MAX_H;
    const ctx=tmp.getContext('2d');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,tmp.width,tmp.height);
    ctx.drawImage(canvas,0,0,tmp.width,tmp.height);
    src=tmp; srcW=tmp.width; srcH=tmp.height;
  }
  const A4H=841.89;                    // A4 高，作为页面最小高度
  const dispH=PW*srcH/srcW;            // 图按页宽铺满后的高度(pt)，比例不变 → 不变形
  const PH=Math.max(A4H,dispH);        // 内容不超过 A4 就用标准 A4；超过则整页加长，始终单页
  return {pages:[{bin:canvasToJpegBin(src,0.92), w:srcW, h:srcH,
                  dispW:PW, dispH:dispH, x:0, y:PH-dispH}], PW:PW, PH:PH};
}
function buildPdfBlob(model){
  const pages=model.pages, PW=model.PW, PH=model.PH, n=pages.length;
  const objCount=2+n*3;
  let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets=new Array(objCount+1);
  function obj(i,body){offsets[i]=out.length; out+=i+' 0 obj\n'+body+'\nendobj\n';}
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  const kids=[];
  for(let i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  for(let i=0;i<n;i++){
    const p=pages[i], pageNo=3+3*i, contNo=4+3*i, imgNo=5+3*i;
    obj(pageNo,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pdfNum(PW)+' '+pdfNum(PH)+'] '
      +'/Resources << /XObject << /Im0 '+imgNo+' 0 R >> >> /Contents '+contNo+' 0 R >>');
    const content='q\n'+pdfNum(p.dispW)+' 0 0 '+pdfNum(p.dispH)+' '
      +pdfNum(p.x)+' '+pdfNum(p.y)+' cm\n/Im0 Do\nQ\n';
    obj(contNo,'<< /Length '+content.length+' >>\nstream\n'+content+'endstream');
    obj(imgNo,'<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h
      +' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bin.length
      +' >>\nstream\n'+p.bin+'\nendstream');
  }
  const xrefPos=out.length;
  out+='xref\n0 '+(objCount+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=objCount;i++)out+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+(objCount+1)+' /Root 1 0 R >>\nstartxref\n'+xrefPos+'\n%%EOF\n';
  const bytes=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)bytes[i]=out.charCodeAt(i)&0xff;
  return new Blob([bytes],{type:'application/pdf'});
}
function exportPDF(){

function isChong(dz1,dz2){

function yaoStatusHtml(zhi,isDong,yueZhi,riZhi,xk){
  let tags=[];
  if(xk.includes(zhi)) tags.push("旬空");

  if(!isDong&&riZhi&&isChong(zhi,riZhi)) tags.push("暗动");
  if(!tags.length) return "";
  return tags.map(t=>{
    const bg = t==="旬空" ? "#888" : "red";
    return `<span style="display:inline-flex;align-items:center;justify-content:center;background:${bg};color:#fff;font-size:9px;line-height:1;padding:0 3px;border-radius:2px;height:12px;box-sizing:border-box;white-space:nowrap;">${t}</span>`;
  }).join(" ");
}
function buildTableHtml(yaos, dizhi, shens, shi, ying, wx, bianYaos, bDizhi, bPal, bShi, bYing, fuShenList, mainYue, mainGua, bianYue, bianGua, yueZhi, riZhi, xk){

       const ysSet=window._yongShen||[];
       const ysStyle=ysSet.includes(lq)?'style="color:#c00;font-weight:bold;"':'';
       const benNaContent = `<span ${ysStyle}>${lq}</span>${zhi}${DIZHI_WX[zhi]}${statusDiv}`;
       const fuShen = fuShenFiltered[i] || "";
       let shiStr = i === shi ? `<span class="shi">世</span>` : "";
       let yingStr = i === ying ? `<span class="ying">应</span>` : "";
       let bianLineHtml = "";
       let bianNaHtml = "";
       let bianShiYing = "";
       if(hasBian){
           const bYao = bianYaos[i];
           const bZhi = bDizhi[i].slice(1);
           // 变卦六亲按主卦（本卦）宫五行配：变爻六亲站在本卦立场断
           const bLq = liuqin(wx, DIZHI_WX[bZhi]);
           bianLineHtml = sym(bYao);
           bianNaHtml = `${bLq}${bZhi}${DIZHI_WX[bZhi]}`;
           if(i===bShi) bianShiYing = `<span class="shi">世</span>`;
           if(i===bYing) bianShiYing = `<span class="ying">应</span>`;
       }
       cells.push(`<div class="cell cell-left">${shens[i]}</div>`);
       cells.push(`<div class="cell cell-left">${fuShen}</div>`);
       cells.push(`<div class="cell yao-ben">${sym(y)}</div>`);
       cells.push(`<div class="cell cell-left" style="${padBottom}">${benNaContent}</div>`);
       cells.push(`<div class="cell" style="padding:2px 2px;">${shiStr}${yingStr}</div>`);
       if(hasBian){
         cells.push(`<div class="cell">${dc}</div>`);

         cells.push(`<div class="cell yao-bian">${bianLineHtml}</div>`);

   }
   // 内层网格pan-wrap：表头+爻行，浮动层直接放在pan-wrap内部以它为定位基准
   const colTrack = hasBian

   return `<div class="pan-wrap${hasBian?' has-bian':''}" id="grid-wrap" style="grid-template-columns:${colTrack}">

       ${hasBian?`<div class="pan-header-item" id="ph-bgua">${bianGua}</div>`:''}
     </div>${cells.join("")}
   </div>`;
}
// 渲染后调用：根据爻符DOM坐标，把顶部文字定位到本卦/变卦列正上方
function layoutPanHeader(){
   const wrap=document.getElementById('grid-wrap');
   if(!wrap)return;
   // 宽屏下限制输出容器与排盘表等宽（含allWrap左右padding 20px*2），避免被上方文字行撑宽
   const all=document.getElementById('allWrap');
   if(all){
     // 页面设计宽537：allWrap与页面等宽，静卦表格在其中居中，超宽表格自适应
     all.style.width=Math.max(537, wrap.offsetWidth+40)+'px';
   }
   const yaoBen=wrap.querySelector('.yao-ben');
   const yaoBian=wrap.querySelector('.yao-bian');
   const hasBian = wrap.classList.contains('has-bian');
   if(!yaoBen)return;
   const rw=wrap.getBoundingClientRect();
   const cs=getComputedStyle(wrap);
   const padL=parseFloat(cs.paddingLeft)||0;
   const padR=parseFloat(cs.paddingRight)||0;
   const contentL=padL;
   const contentW=rw.width-padL-padR;
   const rb=yaoBen.getBoundingClientRect();
   const lx=rb.left-rw.left;
   const top0=rb.top-rw.top;
   const set=(id,left,top)=>{const el=document.getElementById(id);if(el){el.style.left=left+'px';el.style.top=top+'px';el.style.transform='translateX(0)';}};
   // 把一组浮动项整体平移居中于表格内容区，保持组内相对位置不变
   const centerGroup=(ids,top)=>{
     const els=ids.map(id=>document.getElementById(id)).filter(Boolean);
     if(els.length<2)return;
     const left=Math.min(...els.map(e=>e.getBoundingClientRect().left));
     const right=Math.max(...els.map(e=>e.getBoundingClientRect().right));
     const curW=right-left;
     const start=contentL+(contentW-curW)/2;
     const delta=start-(left-rw.left);
     els.forEach(e=>{e.style.left=(parseFloat(e.style.left)+delta)+'px';e.style.top=top+'px';});
   };
   set('ph-yuejian',lx,top0-90);
   set('ph-mgua',lx,top0-56);
   if(hasBian && yaoBian){
     const rn=yaoBian.getBoundingClientRect();
     const lxN=rn.left-rw.left;
     set('ph-richen',lxN,top0-90);
     set('ph-bgua',lxN,top0-56);
     // 月令+日辰一行整体居中于表格
     centerGroup(['ph-yuejian','ph-richen'], top0-90);
     // 主卦名与月令左对齐，变卦名与日辰左对齐
     const yueEl=document.getElementById('ph-yuejian');
     const riEl=document.getElementById('ph-richen');
     const mguaEl=document.getElementById('ph-mgua');
     const bguaEl=document.getElementById('ph-bgua');
     if(yueEl&&mguaEl){
       mguaEl.style.left=(yueEl.getBoundingClientRect().left-rw.left)+'px';
       mguaEl.style.top=(top0-56)+'px';
       mguaEl.style.transform='translateX(0)';
     }
     if(riEl&&bguaEl){
       bguaEl.style.left=(riEl.getBoundingClientRect().left-rw.left)+'px';
       bguaEl.style.top=(top0-56)+'px';
       bguaEl.style.transform='translateX(0)';
     }
   }else{
     // 无变卦：月令、日辰、卦名整体居中于表格内容区，测量实际宽度精确计算
     const halfW=contentL+contentW/2;
     const yueEl=document.getElementById('ph-yuejian');
     const riEl=document.getElementById('ph-richen');
     const gap=30;
     const yueW=yueEl?yueEl.offsetWidth:40;
     const riW=riEl?riEl.offsetWidth:120;
     const totalW=yueW+gap+riW;
     const yueCenter=halfW-totalW/2+yueW/2;
     const riCenter=halfW-totalW/2+yueW+gap+riW/2;
     const setC=(id,left,top)=>{const el=document.getElementById(id);if(el){el.style.left=left+'px';el.style.top=top+'px';el.style.transform='translateX(-50%)';}};
     setC('ph-yuejian', yueCenter, top0-90);
     setC('ph-richen', riCenter, top0-90);
     setC('ph-mgua', halfW, top0-56);
     // 静卦与动卦同一居中基准：月令+日辰组整体再按内容区中心校准一次，避免偏移
     centerGroup(['ph-yuejian','ph-richen'], top0-90);
     const mgEl=document.getElementById('ph-mgua');
     if(mgEl){
       mgEl.style.left=(contentL+contentW/2-mgEl.offsetWidth/2)+'px';
       mgEl.style.top=(top0-56)+'px';
       mgEl.style.transform='translateX(0)';
     }
   }
   // 底部按钮行：宽度自适应按钮组，以表格内容区中轴为中心
   const btnRow=document.getElementById('btn-row');
   if(btnRow&&all){
     const allRect=all.getBoundingClientRect();
     const contentCenterAbs=rw.left+padL+contentW/2;
     btnRow.style.width='max-content';
     btnRow.style.marginLeft='0';
     btnRow.style.marginRight='0';
     const rowW=btnRow.offsetWidth;
     const delta=contentCenterAbs-rowW/2-allRect.left-20;
     btnRow.style.marginLeft=delta+'px';
   }
}
/* ===== 断卦助手：按五行生克 + 月日旺衰规则自动推演用神旺衰 / 生克路线 / 应期 ===== */
const WX_SHENG={木:"火",火:"土",土:"金",金:"水",水:"木"};
const WX_KE={木:"土",土:"水",水:"火",火:"金",金:"木"};
const WX_MU={金:"丑",木:"未",水:"辰",火:"戌",土:"辰"};
const WX_COLOR={木:"#2e7d32",火:"#c62828",土:"#8d6e00",金:"#5f6368",水:"#1565c0"};
const LIUHE_PAIRS=[["子","丑"],["寅","亥"],["卯","戌"],["辰","酉"],["巳","申"],["午","未"]];
function isHe(a,b){return LIUHE_PAIRS.some(function(p){return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a);});}
function wxTag(w){return '<span style="color:'+(WX_COLOR[w]||'#333')+';font-weight:bold">'+w+'</span>';}
function analyzeGua(yaos,dg,dz,gzYue,title,sex){
  const box=function(inner){
    return '<details open style="margin-top:14px;border:1px solid #e3d9c6;border-radius:6px;background:#fdfaf3;padding:10px 12px;">'
      +'<summary style="cursor:pointer;font-weight:bold;color:#8a5a00;">🔮 断卦参考（自动推演，仅供参考）</summary>'
      +'<div style="margin-top:8px;font-size:13px;">'+inner+'</div></details>';
  };
  const row=function(k,v){return '<div style="margin:3px 0;line-height:1.7;"><span style="display:inline-block;min-width:70px;color:#888;">'+k+'</span>'+v+'</div>';};
  const ysList=getYongShen(title,sex);
  if(!ysList.length){
    return box('<div style="color:#999">未填写占事标题，无法确定用神。请在起卦时选择或填写「占事」。</div>');
  }
  const ys=ysList[0];
  const bg=bagua(yaos), up=bg[0], lo=bg[1];
  const info=(HEX_TABLE[up+","+lo]||(up+"上"+lo+"下|"+up+"|1|4")).split("|");
  const guaName=info[0]||"", pal=info[1]||up;
  const wx=PALACE_WX[pal]||"土";
  const loN=NAJIA[lo]||NAJIA["乾"], upN=NAJIA[up]||NAJIA["乾"];
  const dizhi=[].concat(loN[1].map(function(z){return loN[0]+z;}),
                        upN[3].map(function(z){return upN[2]+z;}));
  const xk=xunkong(dg||"甲", dz||"子");
  const yueWx=DIZHI_WX[gzYue]||"土";
  const riWx=DIZHI_WX[dz]||"土";
  const shiIdx=((parseInt(info[2],10)||1)-1);
  const hasDong=yaos.some(function(y){return y.old;});
  const bianYaos=hasDong?yaos.map(function(y){return y.old?{yy:1-y.yy,old:false}:{yy:y.yy,old:false};}):null;
  let bDizhi=[];
  if(bianYaos){
    const bb=bagua(bianYaos), bUp=bb[0], bLo=bb[1];
    bDizhi=[].concat(NAJIA[bLo][1].map(function(z){return NAJIA[bLo][0]+z;}),
                     NAJIA[bUp][3].map(function(z){return NAJIA[bUp][2]+z;}));
  }
  const lqOf=function(i){return liuqin(wx, DIZHI_WX[dizhi[i].slice(1)]);};
  // 用神爻候选：本卦中六亲等于用神的爻
  const cand=[];
  for(let i=0;i<6;i++){ if(lqOf(i)===ys) cand.push(i); }
  let useIdx=null, isFu=false, fuIdx=-1, useZhi="";
  if(cand.length){
    // 取综合最旺的一爻为用神
    const rank=function(i){
      const zhi=dizhi[i].slice(1), y=DIZHI_WX[zhi];
      let s=0;
      if(y===yueWx)s+=2; else if(WX_SHENG[yueWx]===y)s+=1; else if(WX_KE[yueWx]===y)s-=1;
      if(y===riWx)s+=1; else if(WX_SHENG[riWx]===y)s+=1; else if(WX_KE[riWx]===y)s-=1.5;
      if(yaos[i].old)s+=1;
      if(xk.includes(zhi))s-=2;
      if(isChong(zhi,gzYue))s-=2;
      return s;
    };
    cand.sort(function(a,b){return rank(b)-rank(a);});
    useIdx=cand[0]; useZhi=dizhi[useIdx].slice(1);
  }else{
    const fuArr=FU_SHEN_MAP[pal]||[];
    for(let i=0;i<6;i++){ const f=fuArr[i]; if(f&&f.slice(0,2)===ys){isFu=true;fuIdx=i;useZhi=f.slice(-1);break;} }
  }
  if(!useZhi){
    return box('<div style="color:#999">本卦与本宫伏神中均无「'+ys+'」，用神不现，宜另择用神或说明占事后再断。</div>');
  }
  const useWx=DIZHI_WX[useZhi];
  // 旺衰评判
  const notes=[];
  let sc=0;
  if(useWx===yueWx){sc+=2;notes.push('月令当<span style="color:#c00">旺</span>');}
  else if(WX_SHENG[yueWx]===useWx){sc+=1;notes.push('月令<span style="color:#c00">相</span>生');}
  else if(WX_SHENG[useWx]===yueWx){sc+=0;notes.push('泄气于月令（休）');}
  else if(WX_KE[useWx]===yueWx){sc-=1;notes.push('囚于月令');}
  else {sc-=2;notes.push('月令克之（<span style="color:#2e7d32">死</span>）');}
  if(useWx===riWx){sc+=1;notes.push('日辰<span style="color:#c00">值日</span>');}
  else if(WX_SHENG[riWx]===useWx){sc+=1;notes.push('日辰<span style="color:#c00">生扶</span>');}
  else if(WX_SHENG[useWx]===riWx){sc-=0.5;notes.push('泄气于日辰');}
  else if(WX_KE[riWx]===useWx){sc-=1.5;notes.push('日辰<span style="color:#2e7d32">克之</span>');}
  else {sc+=0.5;notes.push('克日辰有力');}
  let kong=false, po=false, anDong=false, ruMu=false;
  if(!isFu){
    if(yaos[useIdx].old){sc+=1;notes.push('用神<span style="color:#c00">发动</span>');}
    if(xk.includes(useZhi)){kong=true;sc-=2;notes.push('<span style="color:#888">旬空</span>');}
    if(isChong(useZhi,gzYue)){po=true;sc-=2;notes.push('<span style="color:#c00">月破</span>');}
    if(!yaos[useIdx].old&&isChong(useZhi,dz)){anDong=true;sc+=0.5;notes.push('<span style="color:#c00">暗动</span>');}
    if(isHe(useZhi,dz))notes.push('日辰合住（事有羁绊）');
  }
  if(WX_MU[useWx]===dz||WX_MU[useWx]===gzYue){ruMu=true;notes.push('入墓于'+WX_MU[useWx]);}
  const level=(sc>=2)?'<b style="color:#c00">旺相</b>'
    :(sc>=0.5)?'<b style="color:#c00">中和偏旺</b>'
    :(sc>-1)?'<b>中和偏衰</b>'

      else if(WX_KE[jw]===useWx)rel='<span style="color:#2e7d32">克用神（凶）</span>';

      else rel='用神克之（耗力）';

      if(bianYaos&&bDizhi[j]){

        if(bw!==jw){
          const back=(bw===useWx)?'变爻帮扶':(WX_SHENG[bw]===useWx)?'<span style="color:#c00">回头生用神（吉）</span>'
            :(WX_KE[bw]===useWx)?'<span style="color:#2e7d32">回头克用神（凶）</span>':'变爻无回头生克';

    else if(WX_KE[useWx]===sw)shiText='用神克世，事来迫我（求财易得，病讼则凶）';
    else if(WX_KE[sw]===useWx)shiText='世克用神，<span style="color:#2e7d32">事难遂</span>，须待用神旺相';

  // 应期
  const yq=[];
  if(isFu)yq.push('用神伏藏，待其出现（值日、出伏之月日）应');
  if(kong)yq.push('用神旬空，出空填实之月日应');

  if(ruMu)yq.push('用神入墓，冲墓开墓（'+WX_MU[useWx]+'）之月日应');
  if(!yq.length)yq.push(hasDong?'有动爻为机，以动爻变爻所指之月日为期':(sc>=1?'用神旺相，值其五行当令之月日应':'用神衰弱，待生扶用神之月日应'));
  if(!hasDong)yq.push('静卦主事缓');
  // 组装

  out+=row('用神爻', isFu
    ? ('<span style="color:#8a5a00">伏藏</span>于'+YAO_LABEL[fuIdx]+'爻　'+ys+useZhi+wxTag(useWx)+'（卦面不现）')
    : (YAO_LABEL[useIdx]+'爻　'+ys+useZhi+wxTag(useWx)+(yaos[useIdx].old?'　<b style="color:#c00">发动</b>':'')));
  out+=row('旺　衰', level+'　'+notes.join('、'));

  out+=row('世　应', shiText);

  out+='<div style="margin-top:8px;color:#999;font-size:12px;">按五行生克与月日旺衰规则自动推演，仅为参考，不作定论。</div>';
  return box(out);

function buildTableHtmlForCopy(wrap){
  const cells=[...wrap.querySelectorAll('.cell')];
  const hasBian=wrap.classList.contains('has-bian');
  const cols=hasBian?10:5;
  const rows=Math.ceil(cells.length/cols);
  const redCell=(cell)=>cell.innerHTML.indexOf('#c00')>=0||/class="(shi|ying)"/.test(cell.innerHTML);
  const cellTxt=(cell,isHeadRow)=>{
    if(!cell)return '';
    if(cell.classList.contains('yao-ben')||cell.classList.contains('yao-bian')){
      if(cell.querySelector('.yao-yang')){
        return '<span style="font-family:\'Courier New\',monospace;letter-spacing:0;word-spacing:0;">▅▅▅▅▅</span>';
      }
      return '<span style="font-family:\'Courier New\',monospace;letter-spacing:0;word-spacing:0;">▅▅</span><span style="font-family:\'Courier New\',monospace;color:#fff;letter-spacing:0;">▅</span><span style="font-family:\'Courier New\',monospace;letter-spacing:0;word-spacing:0;">▅▅</span>';
    }
    const tmp=document.createElement('div');
    tmp.innerHTML=cell.innerHTML;
    // 标注 div → 收集到右对齐标注区
    const statusEls=[...tmp.querySelectorAll('div')];
    const statusHTML=statusEls.map(d=>d.innerHTML).join(' ');
    statusEls.forEach(d=>d.remove());
    tmp.querySelectorAll('.yao-line').forEach(s=>s.remove());
    let main=tmp.innerHTML.replace(/>\s+</g,'><').replace(/\s{2,}/g,' ');
    if(isHeadRow){
      return '<div style="text-align:center;line-height:16px;">'+main+'</div>';
    }
    let h='<div style="text-align:center;height:14px;line-height:14px;overflow:hidden;">'+main+'</div>';
    h+='<div style="text-align:right;height:6px;line-height:6px;overflow:hidden;font-size:6px;">'+(statusHTML||'&nbsp;')+'</div>';
    return h;
  };
  let h='<table border="0" cellspacing="0" cellpadding="0" style="border-collapse:collapse;font-family:SimHei,SimSun,黑体,宋体,Microsoft YaHei,sans-serif;font-size:14px;">';
  for(let r=0;r<rows;r++){
    h+='<tr>';
    for(let c=0;c<cols;c++){
      const cell=cells[r*cols+c];
      const txt=cellTxt(cell, r===0);
      const color=(cell&&redCell(cell))?'color:#c00;font-weight:bold;':'';
      const tdStyle=(r===0)
        ? 'padding:3px 5px;white-space:nowrap;text-align:center;height:auto;vertical-align:middle;font-family:SimHei,黑体,Microsoft YaHei,sans-serif;font-weight:bold;'+color
        : 'padding:0;white-space:nowrap;text-align:center;height:20px;vertical-align:top;font-family:SimHei,黑体,Microsoft YaHei,sans-serif;font-weight:bold;'+color;
      h+=`<td style="${tdStyle}">${txt}</td>`;
    }
    h+='</tr>';
  }
  h+='</table>';
  return h;
}
function buildPlainText(wrap){
  const head=window._expHead||{};
  const strip=s=>String(s||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ');
  const lines=[];
  if(head.line1)lines.push(strip(head.line1));
  if(head.line2)lines.push(strip(head.line2));
  if(head.line3)lines.push(strip(head.line3));
  if(head.shen)lines.push('神煞：'+head.shen);
  if(head.mainYue)lines.push(strip(head.mainYue)+'　　'+strip(head.bianYue||''));
  if(head.mainGua)lines.push(strip(head.mainGua||'')+'　　'+strip(head.bianGua||''));
  const cells=[...wrap.querySelectorAll('.cell')];
  const hasBian=wrap.classList.contains('has-bian');
  const cols=hasBian?10:5;
  const rows=Math.ceil(cells.length/cols);
  for(let r=0;r<rows;r++){
    const arr=[];
    for(let c=0;c<cols;c++){
      const cell=cells[r*cols+c];
      if(cell){
        if(cell.classList.contains('yao-ben')||cell.classList.contains('yao-bian')){
          arr.push(cell.querySelector('.yao-yang')?'▅▅▅▅▅':'▅▅ ▅▅');
        }else{
          arr.push(cell.textContent.replace(/\s+/g,' ').trim());
        }
      }else{arr.push('');}
    }
    lines.push(arr.join('  '));
  }
  return lines.join('\n');
}
function execCopyRich(html,done,fail){
  const container=document.createElement('div');
  container.innerHTML=html;
  container.style.cssText='position:fixed;left:-9999px;top:0;width:800px;';
  document.body.appendChild(container);
  const sel=window.getSelection();sel.removeAllRanges();
  const range=document.createRange();range.selectNodeContents(container);sel.addRange(range);
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  sel.removeAllRanges();document.body.removeChild(container);
  ok?done():fail();
}
function buildFullExportHtml(){

function importCases(){const f=document.getElementById("importFile");if(f)f.click();}
function handleImport(ev){
  const file=ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const arr=JSON.parse(e.target.result);
      if(!Array.isArray(arr)){alert("导入失败：文件内容不是有效的案例数据");return;}
      const valid=arr.filter(c=>c&&Array.isArray(c.yaos)&&c.yaos.length===6);
      if(!valid.length){alert("文件中没有有效案例");return;}
      const cases=getCases();
      const keyOf=c=>JSON.stringify([c.yaos,c.dg,c.dz]);
      const exist=new Set(cases.map(keyOf));
      let added=0;
      valid.forEach(c=>{const k=keyOf(c);if(!exist.has(k)){cases.unshift(c);exist.add(k);added++;}});
      localStorage.setItem("liuyao_cases",JSON.stringify(cases));
      const skipped=valid.length-added;
      alert("导入完成：新增 "+added+" 条"+(skipped?("，跳过重复 "+skipped+" 条"):""));
      showCases();
    }catch(err){alert("导入失败：文件内容不是有效的案例数据");}
  };
  reader.readAsText(file);
  ev.target.value="";
}

// ===== 卦例统计：纯 DOM 条形图，无第三方依赖 =====
function statBarRow(label,val,max,color){
  const pct=max>0?Math.max(2,Math.round(val/max*100)):0;
  return `<div style="display:flex;align-items:center;margin:4px 0;font-size:13px;">
    <span style="display:inline-block;width:56px;text-align:right;margin-right:8px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
    <span style="flex:1;background:#f2f2f2;border-radius:3px;height:14px;display:inline-block;overflow:hidden;">
      <span style="display:block;height:100%;width:${pct}%;background:${color};border-radius:3px;"></span>
    </span>
    <span style="display:inline-block;width:34px;text-align:right;color:#888;margin-left:6px;">${val}</span>
  </div>`;
}
function statColChart(items){
  const max=Math.max(1,...items.map(i=>i.val));
  return `<div style="display:flex;align-items:flex-end;gap:3px;height:96px;margin-top:4px;">`
    +items.map(i=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
        <span style="font-size:10px;color:#888;line-height:1.2;">${i.val||''}</span>
        <span style="display:block;width:100%;height:${Math.max(2,Math.round(i.val/max*60))}px;background:#4a7dbd;border-radius:2px 2px 0 0;margin-top:2px;"></span>
        <span style="font-size:10px;color:#999;margin-top:3px;white-space:nowrap;">${i.label}</span>
      </div>`).join('')
    +`</div>`;
}
function statBox(num,label,color){
  return `<div style="flex:1;min-width:80px;background:#fdfaf3;border:1px solid #ece4d2;border-radius:6px;padding:10px 6px;text-align:center;">
    <div style="font-size:20px;font-weight:bold;color:${color||'#8a5a00'};line-height:1.2;">${num}</div>
    <div style="font-size:12px;color:#888;margin-top:2px;">${label}</div>
  </div>`;
}
function showStats(pushNav){
  if(pushNav)navPush({view:'stats'});
  const all=getCases();
  const total=all.length;
  const card=(t,inner)=>`<div style="border:1px solid #e6e0d4;border-radius:6px;background:#fff;padding:10px 12px;margin-bottom:10px;"><div style="font-weight:bold;color:#8a5a00;margin-bottom:8px;">${t}</div>${inner}</div>`;
  if(!total){
    document.getElementById("app").innerHTML=
      `<div class="case-list"><h3 style="text-align:center;margin:0 0 10px;">统　计</h3>
       <div style="text-align:center;color:#999;padding:30px 0;">暂无案例，先起几卦并保存吧</div>
       <div style="text-align:center;margin-top:20px;"><button class="ghost" onclick="navBack()">← 返回</button></div></div>`;
    return;
  }
  const hasDuan=all.filter(c=>c.duanyu&&String(c.duanyu).trim()).length;
  const hasYing=all.filter(c=>c.yingyan&&String(c.yingyan).trim()).length;
  const rate=hasDuan?Math.round(hasYing/hasDuan*100):0;
  const dongCases=all.filter(c=>Array.isArray(c.yaos)&&c.yaos.some(y=>y.old)).length;
  // 卦宫分布
  const palOrder=["乾","兑","离","震","巽","坎","艮","坤"];
  const palMap={}; palOrder.forEach(p=>palMap[p]=0);
  all.forEach(c=>{const p=(c.pal||"").trim(); if(p)palMap[p]=(palMap[p]||0)+1;});
  const palItems=palOrder.concat(Object.keys(palMap).filter(k=>palOrder.indexOf(k)<0))
    .map(k=>[k,palMap[k]||0]);
  const palMax=Math.max(1,...palItems.map(i=>i[1]));
  // 占事分类
  const titleMap={};
  all.forEach(c=>{const t=(c.title||"").trim()||"未分类";titleMap[t]=(titleMap[t]||0)+1;});
  const titleItems=Object.keys(titleMap).map(k=>[k,titleMap[k]]).sort((a,b)=>b[1]-a[1]);
  const titleMax=Math.max(1,...titleItems.map(i=>i[1]));
  // 月令分布
  const yueMap={}; DZ.forEach(z=>yueMap[z]=0);
  all.forEach(c=>{const z=(c.gzYue||"").trim(); if(z in yueMap)yueMap[z]++;});
  const yueItems=DZ.map(z=>[z,yueMap[z]]);
  const yueMax=Math.max(1,...yueItems.map(i=>i[1]));
  // 近 12 个月新增
  const now=new Date(), months=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0'),
                 label:String(d.getMonth()+1)+"月", val:0});
  }
  const mIndex={}; months.forEach((m,i)=>mIndex[m.key]=i);
  let noTime=0;
  all.forEach(c=>{
    const m=String(c.savetime||"").match(/(\d{4})[\/\-](\d{1,2})/);
    if(!m){noTime++;return;}
    const key=m[1]+"-"+String(parseInt(m[2],10)).padStart(2,'0');
    if(key in mIndex)months[mIndex[key]].val++; else noTime++;
  });
  let html=`<div class="case-list"><h3 style="text-align:center;margin:0 0 10px;">统　计</h3>`;
  html+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
    ${statBox(total,'案例总数')}${statBox(hasDuan,'有断语','#2e7d32')}
    ${statBox(hasYing,'有应验','#c62828')}${statBox(rate+'%','应验率','#8a5a00')}</div>`;
  html+=card('卦宫分布', palItems.map(i=>statBarRow(i[0]+'宫',i[1],palMax,'#c9a227')).join(''));
  html+=card('占事分类', titleItems.map(i=>statBarRow(i[0],i[1],titleMax,'#4a7dbd')).join(''));
  html+=card('月令分布', yueItems.map(i=>statBarRow(i[0]+'月',i[1],yueMax,'#7a9e3e')).join(''));
  html+=card('近 12 个月新增', statColChart(months)
    +(noTime?`<div style="font-size:11px;color:#aaa;margin-top:4px;">另有 ${noTime} 条无时间信息，未计入</div>`:''));
  html+=card('动静比例', statBarRow('有动爻',dongCases,total,'#c62828')+statBarRow('静卦',total-dongCases,total,'#9e9e9e'));
  html+=`<div style="text-align:center;margin-top:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">
    <button style="width:110px" onclick="showCases(1)">📋 案例列表</button>
    <button class="ghost" style="width:110px" onclick="navBack()">← 返回</button></div></div>`;
  document.getElementById("app").innerHTML=html;
}

/* ===== 触屏缩放：系统原生缩放（流畅）+ 松手固化停留 + 双击复原 ===== */
(function(){
  if(!('ontouchstart' in window))return;
  var layoutW=537,settleTimer=0,meta=document.querySelector('meta[name="viewport"]');
  var userScaling=false,lastFitAt=0;
  function clamp(s){return Math.max(0.2,Math.min(10,s));}
  function getScale(){
    if(window.visualViewport&&visualViewport.width){return layoutW/visualViewport.width;}
    return 1;
  }
  function setInitialScale(s){
    s=clamp(s);
    if(meta)meta.setAttribute('content','width='+layoutW+', initial-scale='+s+', minimum-scale=0.2, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover');
  }
  function fit(force){
    userScaling=false;lastFitAt=Date.now();
    clearTimeout(settleTimer);
    var vw=screen.width||window.innerWidth;
    var s=clamp((vw>0&&vw<layoutW)?vw/layoutW:1);
    if(!meta)return;
    var target='width='+layoutW+', initial-scale='+s+', minimum-scale=0.2, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover';
    // 已经是目标状态就直接返回：不重写 viewport，避免整页重排（会造成闪烁与点击错位）
    if(!force&&meta.getAttribute('content')===target)return;
    // 放大状态下直接改 initial-scale 可能不生效：width 抖动强制浏览器重新应用 viewport
    meta.setAttribute('content','width='+(layoutW+1)+', initial-scale=1, minimum-scale=0.2, maximum-scale=10.0, user-scalable=yes, viewport-fit=cover');
    setTimeout(function(){
      meta.setAttribute('content',target);
    },0);
  }
  // 视觉视口变化：仅在用户双指缩放时固化当前比例，fit触发的缩放不固化（避免加载时自动放大）
  if(window.visualViewport){
    visualViewport.addEventListener('resize',function(){
      if(!userScaling)return;
      if(Date.now()-lastFitAt<800)return;
      clearTimeout(settleTimer);
      settleTimer=setTimeout(function(){setInitialScale(getScale());},120);
    });
  }
  // 双指缩放过程中实时固化当前比例：浏览器认为当前缩放即初始状态，缩再小也不会回弹
  var raf=0;
  document.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&userScaling){
      if(raf)return;
      raf=requestAnimationFrame(function(){
        raf=0;
        setInitialScale(getScale());
      });
    }
  },{passive:true});
  /* 双击空白处复原缩放。
     要点：① 只在 touchend 判定，和「上一次抬起」比时间，绝不与本次按下比（否则每次单击都会被误判成双击）；
           ② 不调用 preventDefault，避免吞掉按钮的 click；
           ③ 触摸有位移（>12px）视为拖动/滚动，不参与双击；
           ④ 落在按钮/输入框等交互元素上不响应，防止连点按钮时页面缩放跳变。 */
  var multiTouch=false,tapX=0,tapY=0,tapMoved=false,lastTapEnd=0;
  function onInteractive(el){
    while(el&&el.nodeType===1){
      var tag=el.tagName;
      if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL')return true;
      if(el.hasAttribute&&el.hasAttribute('onclick'))return true;
      if(el===document.body)return false;
      el=el.parentNode;
    }
    return false;
  }
  document.addEventListener('touchstart',function(e){
    if(e.touches.length>=2){userScaling=true;multiTouch=true;tapMoved=true;return;}
    if(e.touches.length===1&&e.touches[0]){
      tapX=e.touches[0].clientX;tapY=e.touches[0].clientY;tapMoved=false;
    }
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(tapMoved||e.touches.length!==1||!e.touches[0])return;
    var dx=e.touches[0].clientX-tapX,dy=e.touches[0].clientY-tapY;
    if(dx*dx+dy*dy>144)tapMoved=true;
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(e.touches.length)return;
    if(multiTouch){multiTouch=false;lastTapEnd=0;return;}
    if(tapMoved||e.changedTouches.length!==1)return;
    if(onInteractive(e.target)){lastTapEnd=0;return;}
    var now=Date.now();
    if(lastTapEnd&&now-lastTapEnd<350){lastTapEnd=0;fit(true);}
    else lastTapEnd=now;
  },{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(fit,200);});
  setTimeout(fit,0);
  window.__zoomFit=fit;
})();
</script>

<script>
/* ===== Android / GitHub Pages 引导 ===== */
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
  function isStandalone(){
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
      || window.navigator.standalone===true;
  }
  var deferred=null, bar=null;
  function hide(){ if(bar){ bar.remove(); bar=null; } }
  function show(){
    if(bar || isStandalone()) return;
    bar=document.createElement('div');
    bar.id='installBar';
    bar.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9997;background:#1a3a5c;color:#fff;'
      +'font-size:13px;line-height:1.5;padding:10px 14px;display:flex;align-items:center;gap:10px;'
      +'padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.2);';
    bar.innerHTML='<span style="flex:1;">📲 安装到桌面，离线也能摇卦</span>'
      +'<button id="installGo" style="background:#d4a24c;border:0;color:#1a3a5c;font-weight:600;'
      +'padding:6px 14px;border-radius:4px;font-size:13px;margin:0;cursor:pointer;">安装</button>'
      +'<button id="installNo" style="background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;'
      +'padding:6px 10px;border-radius:4px;font-size:12px;margin:0;cursor:pointer;">以后</button>';
    document.body.appendChild(bar);
    document.getElementById('installNo').onclick=function(){ hide(); };
    document.getElementById('installGo').onclick=function(){
      if(!deferred){ hide(); return; }
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred=null; hide(); });
    };
  }
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferred=e; show();
  });
  window.addEventListener('appinstalled',function(){ hide(); });
})();
</script>
